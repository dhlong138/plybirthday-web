<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111225">
  <meta name="description" content="Một món quà sinh nhật nhỏ, dành riêng cho bạn.">
  <title>Happy Birthday · Dành cho bạn</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111225'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="lock-screen" aria-labelledby="lock-title">
    <div class="lock-content">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h2 id="lock-title">Nhập mật mã</h2>
      <p>Một bí mật nhỏ dành cho bạn</p>
      <div class="passcode-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <span class="sr-only" id="code-status" role="status" aria-live="polite">Đã nhập 0 trên 4 số</span>
      <div class="keypad" aria-label="Bàn phím mật mã">
        <button type="button" data-digit="1">1<span>&nbsp;</span></button>
        <button type="button" data-digit="2">2<span>ABC</span></button>
        <button type="button" data-digit="3">3<span>DEF</span></button>
        <button type="button" data-digit="4">4<span>GHI</span></button>
        <button type="button" data-digit="5">5<span>JKL</span></button>
        <button type="button" data-digit="6">6<span>MNO</span></button>
        <button type="button" data-digit="7">7<span>PQRS</span></button>
        <button type="button" data-digit="8">8<span>TUV</span></button>
        <button type="button" data-digit="9">9<span>WXYZ</span></button>
        <span></span><button type="button" data-digit="0">0</button>
        <button type="button" class="delete-digit" aria-label="Xóa số cuối">⌫</button>
      </div>
    </div>
    <noscript>Bật JavaScript để mở món quà nhé.</noscript>
  </div>
  <dialog class="wrong-code" aria-labelledby="wrong-title">
    <h2 id="wrong-title">Sai mật mã rồi 😏</h2>
    <img src="./assets/wrong-code-meme.png" alt="Meme chú ếch với dòng chữ Phiếu bé ngu">
    <p>Thử lại nhé, không giới hạn lượt đâu!</p>
    <button class="gift-button retry-code" type="button">Thử lại</button>
  </dialog>
  <main class="birthday-book" aria-label="Món quà sinh nhật" tabindex="0" hidden inert>
    <section class="birthday-page pdf-page page-1" id="page-1" aria-label="Trang 1 trên 8">
      <img class="slide-image" src="./assets/slides/slide-01.webp" alt="Lời mở đầu: món quà sinh nhật từ 7 con rắn dành riêng cho Ply, với thiết kế biển xanh ngọc trai." width="1079" height="1920" loading="eager" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-2" id="page-2" aria-label="Trang 2 trên 8">
      <img class="slide-image" src="./assets/slides/slide-02.webp" alt="Lời chúc tuổi mới sang trang, ngày càng giỏi giang, sự nghiệp vững vàng. Bố cục chữ ngang, dọc và xoay theo bản thiết kế." width="1079" height="1920" loading="eager" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-3" id="page-3" aria-label="Trang 3 trên 8">
      <img class="slide-image" src="./assets/slides/slide-03.webp" alt="Ảnh kỷ niệm trên sân khấu, trong khung biển xanh." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-4" id="page-4" aria-label="Trang 4 trên 8">
      <img class="slide-image" src="./assets/slides/slide-04.webp" alt="Lời chúc nhớ ngày đầu gặp nhau 22 tháng 7, mong nàng luôn xinh đẹp, nhiều niềm vui và hạnh phúc." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-5" id="page-5" aria-label="Trang 5 trên 8">
      <img class="slide-image" src="./assets/slides/slide-05.webp" alt="Ảnh bạn cầm lời chúc: Chúc mừng sinh nhật PLy, chúc năm nay giải thoát khỏi đất Việt Nam thành công và cuộc sống luôn rực rỡ." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-6" id="page-6" aria-label="Trang 6 trên 8">
      <img class="slide-image" src="./assets/slides/slide-06.webp" alt="Alles Gute zum Geburtstag, Ly — chúc mừng sinh nhật Ly bằng tiếng Đức." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-7" id="page-7" aria-label="Trang 7 trên 8">
      <img class="slide-image" src="./assets/slides/slide-07.webp" alt="Chúc mừng sinh nhật mom Ly, tuổi mới xinh đẹp, thành công trong học tập, công việc, đời sống và tốt nghiệp xuất sắc." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
    <section class="birthday-page pdf-page page-8" id="page-8" aria-label="Trang 8 trên 8">
      <img class="slide-image" src="./assets/slides/slide-08.webp" alt="Chúc Ly tuổi mới mạnh khỏe, vui vẻ, gặp nhiều may mắn trong cuộc sống và học tập. Mãi nhớ điệu cười mồi của Ly." width="1079" height="1920" loading="lazy" decoding="async">
    </section>
  </main>
</body>
</html>
